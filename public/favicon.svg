<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Les Pros de l'Yonne">
  <!--
    Marque du site : la maison et sa pousse, reprises telles quelles de
    src/components/BrandMark.astro. Le tracé est identique à celui de l'en-tête,
    au fond et à l'échelle près — l'icône et le logo ne peuvent donc pas diverger.

    Le fond vert plein est délibéré : un favicon transparent devient illisible
    sur les onglets sombres, et le contraste or sur vert profond reste net à
    16 pixels, taille à laquelle un tracé fin disparaîtrait.
  -->
  <rect width="64" height="64" rx="15" fill="#123d2c" />
  <g
    transform="translate(10 10) scale(1.8333)"
    fill="none"
    stroke="#f2c14e"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3.6 10.4 12 3.6l8.4 6.8" />
    <path d="M5.6 9.4V20h12.8V9.4" />
    <path d="M12 20v-4.6" />
    <path d="M12 15.4c-1.9 0-3.4-1.4-3.4-3.2 1.9 0 3.4 1.4 3.4 3.2Z" />
    <path d="M12 15.4c1.9 0 3.4-1.4 3.4-3.2-1.9 0-3.4 1.4-3.4 3.2Z" />
  </g>
</svg>
